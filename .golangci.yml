version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unconvert
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.Tx).Rollback # deferred after Commit: ErrTxDone is expected
    staticcheck:
      checks:
        - all
        - -ST1000 # package comment: not required
        - -ST1005 # error strings may start with a proper noun (DolphinDB, MCP)
        - -ST1016 # receiver name consistency: judged in review
        - -ST1022 # unexported comment form
  exclusions:
    generated: lax
    presets:
      - std-error-handling
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/initiallyqq/data-api-framework
